query AllCourses @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  courses {
    id
    title
    description
    category
    price
    instructor {
      id
      name
    }
  }
}

query UserEnrollments @auth(level: USER, insecureReason: "This operation is safe to expose to all logged in users.") {
  enrollments(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    course {
      id
      title
      price
    }
    enrollmentDate
  }
}

mutation EnrollInCourse($courseId: ID!) @auth(level: USER) {
  enrollment: enrollment_insert(
    data: { courseId: $courseId, userId_expr: "auth.uid" }
  )
}

mutation UpdateUserProfile($name: String, $email: String) @auth(level: USER) {
  user: user_update(
    key: { id_expr: "auth.uid" }
    data: { name: $name, email: $email }
  )
}